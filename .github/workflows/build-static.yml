name: Build Static Export

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 1

      - name: Display Git info
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "All branches:"
          git branch -a || echo "No branches found"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://demo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'demo-key' }}

      - name: Export static files
        run: |
          set -e
          pnpm run export || echo "Export skipped, using build output"
          # 打包构建产物
          if [ -d ".next/standalone" ]; then
            tar -czf static-export.tar.gz .next/standalone/ .next/static/ public/
          else
            tar -czf static-export.tar.gz .next/ public/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: static-export.tar.gz
          retention-days: 7
