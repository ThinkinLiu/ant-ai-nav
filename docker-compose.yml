# 蚂蚁AI导航 - Docker Compose 配置
# 
# 使用方法：
#   开发环境: docker-compose up -d
#   生产环境: docker-compose -f docker-compose.yml up -d
#
# 常用命令：
#   启动: docker-compose up -d
#   停止: docker-compose down
#   重启: docker-compose restart
#   日志: docker-compose logs -f
#   重建: docker-compose up -d --build

services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
        - COZE_WORKLOAD_IDENTITY_API_KEY
        - COZE_WORKLOAD_IDENTITY_CLIENT_ID
        - COZE_WORKLOAD_IDENTITY_CLIENT_SECRET
        - COZE_INTEGRATION_BASE_URL
    image: ant-ai-nav:latest
    container_name: ant-ai-nav
    
    # 端口映射
    ports:
      - "5000:5000"
    
    # 环境变量
    environment:
      - NODE_ENV=production
      - PORT=5000
      # 以下环境变量从 .env 文件读取或在此设置
      # - NEXT_PUBLIC_SUPABASE_URL=https://xxx.supabase.co
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY=your-key
      # - SUPABASE_SERVICE_ROLE_KEY=your-key
    
    # 环境变量文件
    env_file:
      - .env.local
    
    # 重启策略
    restart: unless-stopped
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络
    networks:
      - ant-ai-nav-network

# ==================== 网络配置 ====================
networks:
  ant-ai-nav-network:
    driver: bridge
